[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multicamera"
dynamic = ["version"]
description = "Multi stereo camera joint calibration and point cloud fusion"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-contrib-python>=4.9,<5",
    "numpy>=1.24",
    "aiohttp>=3.9",
    "scipy>=1.11",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.3",
    "tomli>=2; python_version < '3.11'",
]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.6,<4",
]
pointcloud = [
    "open3d>=0.18",
]
build-win = [
    "pyinstaller>=6.0",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
multicamera = "multicamera.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "multicamera.__version__"}

[tool.setuptools.package-data]
multicamera = ["ui/icons/*.svg", "ui/icons/LICENSE", "ui/icons/SOURCE.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
