name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      installer:
        description: "Build Inno Setup installer"
        required: false
        default: false
        type: boolean
      pointcloud:
        description: "Include Open3D point cloud runtime"
        required: false
        default: false
        type: boolean
      installer_compression:
        description: "Installer compression: normal is faster; ultra64 prioritizes size"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - max
          - ultra64
      audit_release:
        description: "Optional existing Release tag to inspect its archived OpenCV binary"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/constraints.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          if ("${{ inputs.pointcloud }}" -eq "true") {
            python -m pip install --disable-pip-version-check --prefer-binary -c packaging/windows/constraints.txt -e ".[build-win,test,pointcloud]"
          } else {
            python -m pip install --disable-pip-version-check --prefer-binary -c packaging/windows/constraints.txt -e ".[build-win,test]"
          }
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency consistency check failed" }

      - name: Validate release version and checkout
        shell: pwsh
        run: |
          $checkArgs = @("scripts/check_release.py", "--installed", "--require-clean", "--print-version")
          if ($env:GITHUB_REF_TYPE -eq "tag") { $checkArgs += @("--tag", $env:GITHUB_REF_NAME) }
          $version = python @checkArgs
          if ($LASTEXITCODE -ne 0) { throw "Release consistency validation failed" }
          "PRODUCT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inspect previous Release OpenCV
        if: ${{ inputs.audit_release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_RELEASE: ${{ inputs.audit_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $downloadDir = Join-Path $env:RUNNER_TEMP "opencv-previous-release"
          gh release download $env:AUDIT_RELEASE --repo $env:GH_REPO --dir $downloadDir --pattern "MultiCamera_portable*_x64.zip" --pattern "SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous Release" }
          $archives = @(Get-ChildItem $downloadDir -File -Filter "MultiCamera_portable*_x64.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one portable ZIP in previous Release" }
          $zipPath = $archives[0].FullName
          $checksumPattern = '^[0-9a-fA-F]{64}\s+\*?' + [regex]::Escape($archives[0].Name) + '$'
          $records = @(Get-Content (Join-Path $downloadDir "SHA256SUMS.txt") | Where-Object { $_ -match $checksumPattern })
          if ($records.Count -ne 1) { throw "Expected exactly one matching portable ZIP checksum" }
          $expected = ($records[0] -split '\s+', 2)[0]
          if ((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "Previous Release archive checksum mismatch"
          }
          python scripts/inspect_packaged_opencv.py $zipPath --report installer_output/previous_opencv_audit.json
          if ($LASTEXITCODE -ne 0) { throw "Previous OpenCV inspection failed" }

      - name: Validate calibration regressions
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MULTICAMERA_TEST_OPENCV_THREADS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m pytest -q tests -n 2 --dist loadfile --max-worker-restart=0 --durations=30 --junitxml=installer_output/regression_tests.xml
          if ($LASTEXITCODE -ne 0) { throw "Calibration regression tests failed" }

      - name: Summarize regression timing
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path "installer_output/regression_tests.xml") {
            python scripts/report_test_timing.py installer_output/regression_tests.xml --output installer_output/regression_metrics.json --summary $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { throw "Regression timing report failed" }
          }

      - name: Validate source calibration
        shell: pwsh
        run: |
          python -m multicamera --self-test-calibration --report installer_output/calibration_source_test.json
          if ($LASTEXITCODE -ne 0) { throw "Source calibration self-test failed" }

      - name: Build portable app
        shell: pwsh
        env:
          MULTICAMERA_WITH_OPEN3D: ${{ inputs.pointcloud && '1' || '' }}
        run: |
          pyinstaller --noconfirm MultiCamera.spec

      - name: Validate final EXE calibration
        shell: pwsh
        run: ./scripts/test_packaged_calibration.ps1

      - name: Summarize calibration diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          foreach ($report in @("calibration_source_test", "calibration_self_test", "previous_opencv_audit")) {
            $path = "installer_output/$report.json"
            if (Test-Path $path) {
              "### $report" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $path -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Locate or install Inno Setup
        if: ${{ github.event_name == 'push' || inputs.installer }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Find-Iscc {
            foreach ($path in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $path) { return $path }
            }
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
          }
          $iscc = Find-Iscc
          if (!$iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = Find-Iscc
          }
          if (!$iscc) { throw "Inno Setup compiler was not found" }
          "ISCC_EXE=$iscc" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Windows distributions
        shell: pwsh
        env:
          BUILD_INSTALLER: ${{ github.event_name == 'push' || inputs.installer }}
          INSTALLER_COMPRESSION: ${{ inputs.installer_compression || 'normal' }}
        run: |
          $packageArgs = @("scripts/package_windows.py", "--version", $env:PRODUCT_VERSION)
          if ($env:BUILD_INSTALLER -eq "true") {
            $packageArgs += @("--installer-compiler", $env:ISCC_EXE,
              "--installer-compression", $env:INSTALLER_COMPRESSION)
          }
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { throw "Windows distribution packaging failed" }

      - name: Summarize packaging performance
        if: ${{ always() }}
        shell: pwsh
        run: |
          $path = "installer_output/packaging_metrics.json"
          if (Test-Path $path) {
            '### Packaging performance' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content $path -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Publish Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_INSTALLER: ${{ github.event_name == 'push' || inputs.installer }}
          BUILD_POINTCLOUD: ${{ inputs.pointcloud || false }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(Get-Item "installer_output/MultiCamera_portable_$($env:PRODUCT_VERSION)_x64.zip")
          $assets += Get-Item "installer_output/calibration_source_test.json", "installer_output/calibration_self_test.json"
          $assets += Get-Item "installer_output/packaging_metrics.json"
          if (Test-Path "installer_output/previous_opencv_audit.json") {
            $assets += Get-Item "installer_output/previous_opencv_audit.json"
          }
          if ($env:BUILD_INSTALLER -eq "true") {
            $installers = @(Get-Item "installer_output/MultiCamera_Setup_$($env:PRODUCT_VERSION)_x64.exe")
            if ($installers.Count -eq 0) { throw "Windows installer was not generated" }
            $assets += $installers
          }
          foreach ($asset in $assets) {
            if ($asset.Length -eq 0 -or $asset.Length -ge 2GB) {
              throw "Release asset must be non-empty and under 2 GiB: $($asset.Name)"
            }
          }
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $checksumPath = "installer_output/SHA256SUMS.txt"
          $checksums | Set-Content $checksumPath -Encoding utf8
          $assetPaths = @($assets.FullName) + @($checksumPath)

          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "windows-build-$env:GITHUB_RUN_ID"
          }
          $prerelease = $env:GITHUB_REF_TYPE -ne "tag" -or $tag.Contains("-")
          $variant = if ($env:BUILD_POINTCLOUD -eq "true") { "With Open3D" } else { "Lightweight (no Open3D)" }
          $title = "MultiCamera Windows $tag"
          $notesPath = Join-Path $env:RUNNER_TEMP "windows-release-notes.md"
          @(
            "Windows x64 build of MultiCamera Stereo Calibration.",
            "", "Version: $env:PRODUCT_VERSION", "Tag: $tag",
            "Commit: $env:GITHUB_SHA", "Variant: $variant",
            "Features: session image/result restoration, verified RGB+IR continuation, and standalone stereo JSON/OpenCV parameter import with explicit units.",
            "Fixes: transactional session switching, metadata snapshot consistency, auxiliary parameter isolation, and explicit RGB+IR corner-order review with convergence and holdout validation retained.",
            "Calibration updates: reversible detector grid numbering, per-training-fold automatic cross-modal correspondence, weak single-view PnP diagnostics without false vetoes, and separate input-attestation/final-order evidence.",
            "Workflow updates: explicit offline/online session opening, restored live guidance after historical reload, separate historical/new capture counts, and independent preview/original-image detection receipts. Release publication retries transient failures without replacing published assets.",
            "Changes: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/CHANGELOG.md",
            "Known limitations: self-tests do not establish hardware calibration accuracy or replace physical camera/UI checks on the target Windows device.",
            "RGB+auxiliary joint results are candidates pending physical validation; per-pair input declarations do not physically verify the algorithm's final correspondence. Recorded-stream replay does not verify real-device white balance or synchronization.",
            "Kalibr radtan cannot losslessly represent higher-order RGB distortion; use JSON or complete OpenCV YAML when that format is rejected.",
            "", "Download the portable ZIP or, when included, the Setup EXE.",
            "SHA256SUMS.txt contains checksums for the binary downloads.",
            "calibration_self_test.json records calibration and export executed by the final EXE.",
            "calibration_source_test.json records the matching source-runtime baseline.",
            "", "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content $notesPath -Encoding utf8

          $publishArgs = @("scripts/publish_windows_release.py",
            "--repo", $env:GH_REPO, "--tag", $tag,
            "--commit", $env:GITHUB_SHA, "--run-id", $env:GITHUB_RUN_ID,
            "--title", $title, "--notes-file", $notesPath, "--attempts", "4")
          if ($prerelease) { $publishArgs += "--prerelease" }
          $publishArgs += @("--assets") + $assetPaths
          $releaseUrl = python @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "Could not safely publish Windows Release" }
          "Windows downloads: $releaseUrl" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
