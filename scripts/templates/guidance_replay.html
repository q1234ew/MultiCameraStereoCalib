<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双目采图引导回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20252c;font:14px system-ui,sans-serif;letter-spacing:0}
header,main,footer{max-width:1440px;margin:auto;padding:16px 24px}header{display:flex;align-items:center;gap:20px;border-bottom:1px solid #d6dbe2}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}header span{color:#5b6675}button,select{font:inherit;border:1px solid #b9c2ce;background:white;border-radius:4px;padding:8px 12px;color:inherit;min-height:38px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #147ad6;outline-offset:2px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}input[type=range]{flex:1;min-width:120px;accent-color:#147ad6}#stepSelect{max-width:220px}.images{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:8px}.images img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#15191e;display:block}.band{padding:16px 0;border-bottom:1px solid #d6dbe2}.recommendation{display:grid;grid-template-columns:1fr 1fr;gap:24px}.recommendation p{margin:4px 0;line-height:1.6}.kicker{color:#647184;font-size:12px}.suggestion{font-size:17px;font-weight:600;color:#146bb4}.verdict{font-weight:600;color:#80600a}.details{display:grid;grid-template-columns:1fr 1fr;gap:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font:13px system-ui;margin:0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #d6dbe2;padding:9px 6px}tr.active{background:#e3eefb}tbody tr{cursor:pointer}tbody tr:hover{background:#e9edf2}.table-scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,50px);gap:2px;margin:6px 0}.grid span{text-align:center;background:#e4e8ee;padding:8px}.grid .target{background:#d3eafa;outline:2px solid #147ad6}.muted{color:#647184}footer{font-size:12px;color:#647184;line-height:1.6}.warning{color:#80600a}#finalSummary{line-height:1.7}#comparison{overflow-wrap:anywhere}@media(max-width:720px){header,main,footer{padding:12px}header{align-items:flex-start;flex-direction:column;gap:4px}.images,.recommendation,.details{grid-template-columns:1fr}.images img{max-height:300px}.toolbar input{flex-basis:100%}h1{font-size:20px}}
</style>
<header><h1>双目采图引导回放</h1><span id="dataset"></span></header>
<main>
<nav class="toolbar" aria-label="回放控制"><button id="prev" title="上一帧">上一帧</button><button id="play" aria-pressed="false">自动播放</button><button id="next" title="下一帧">下一帧</button><select id="stepSelect" aria-label="选择图片"></select><input id="slider" type="range" min="0" aria-label="回放位置"><span id="position"></span></nav>
<section class="images"><figure><figcaption>RGB 左目</figcaption><img id="leftImage" alt="当前左目原图"></figure><figure><figcaption>RGB 右目</figcaption><img id="rightImage" alt="当前右目原图"></figure></section>
<section class="band recommendation"><div><div class="kicker">加入当前图片前 · 仅使用历史观测</div><h2>当前采图建议</h2><p class="suggestion" id="recommendation"></p><div class="grid" id="targetGrid" aria-label="建议区域，上方为图像上方"></div><p class="muted" id="beforeSummary"></p></div><div><div class="kicker">当前图片 · 静态构图核对</div><h2 id="frameTitle"></h2><p class="verdict" id="verdict"></p><pre id="comparison"></pre><p class="muted">运动稳定、同步与白平衡：不评估</p></div></section>
<section class="band details"><div><h2>加入后 · 下一步建议</h2><p id="afterRecommendation"></p><p class="muted" id="afterSummary"></p></div><div><h2>全量回放结果</h2><div id="finalSummary"></div></div></section>
<section class="band"><h2>逐帧记录</h2><div class="table-scroll"><table><thead><tr><th>图片</th><th>历史内参</th><th>去重样本变化</th><th>对此前建议的核对</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><footer><div id="board"></div><div id="limits"></div><p>原图只读引用 · 未覆盖标定结果 · 引导匹配不代表标定精度或采集完成</p></footer>
<script>
const report=__REPLAY_DATA__;
const $=id=>document.getElementById(id), steps=report.steps;
let index=0,timer=null;
const regions=[['左上','上方','右上'],['左侧','中央','右侧'],['左下','下方','右下']];
const tilts={front:'正对镜头',left:'左边近',right:'右边近',up:'上边近',down:'下边近'}, scales={small:'小',medium:'中',large:'大'};
const recText=r=>`${regions[r.zone_row][r.zone_col]} · ${tilts[r.tilt]} · ${scales[r.scale]}画面占比`+(r.target_center?` · 目标中心 ${r.target_center.map(v=>v.toFixed(2)).join(', ')}`:'')+(r.target_area?` · 参考角点包络 ${(r.target_area*100).toFixed(1)}%（非固定验收值）`:'');
$('dataset').textContent=`${steps.length} 对图像 · ${report.model} · 文件编号顺序`;
$('slider').max=steps.length-1;
steps.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.frame_id;$('stepSelect').append(o);const tr=document.createElement('tr');tr.tabIndex=0;[s.frame_id,`${s.before.intrinsic_cameras.length}/2`,`${s.unique_sample_change>=0?'+':''}${s.unique_sample_change}`,s.verdict.reason].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tr.onclick=()=>show(i);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}};$('rows').append(tr)});
function stop(){clearInterval(timer);timer=null;$('play').textContent='自动播放';$('play').setAttribute('aria-pressed','false')}
function show(i){index=Math.max(0,Math.min(i,steps.length-1));const s=steps[index],r=s.before.recommendation;$('leftImage').src=s.files.left.url;$('rightImage').src=s.files.right.url;$('position').textContent=`${index+1} / ${steps.length}`;$('slider').value=index;$('stepSelect').value=index;$('prev').disabled=index===0;$('next').disabled=index===steps.length-1;$('recommendation').textContent=recText(r);$('beforeSummary').textContent=s.before.summary;$('frameTitle').textContent=`图片 ${s.frame_id}`;$('verdict').textContent=s.verdict.reason;$('comparison').textContent=['left','right'].map(c=>{const m=s.measurement[c],name=c==='left'?'左目':'右目';if(!m.geometry_valid)return `${name}：检测点 ${s.files[c].detected_corners}，几何不满足引导要求`;return `${name}：${m.corners} 点 · 中心 ${m.center.map(v=>v.toFixed(2)).join(', ')} · 占比 ${(m.area*100).toFixed(1)}%\n倾角（历史内参）：${m.pose?`左右 ${m.pose.yaw.toFixed(1)}° / 上下 ${m.pose.pitch.toFixed(1)}°`:'未验证'}`}).join('\n\n');$('afterRecommendation').textContent=s.after.recommendation.reason;$('afterSummary').textContent=s.after.summary;$('targetGrid').replaceChildren();for(let row=0;row<3;row++)for(let col=0;col<3;col++){const cell=document.createElement('span');cell.textContent=regions[row][col];if(row===r.zone_row&&col===r.zone_col)cell.className='target';$('targetGrid').append(cell)}Array.from($('rows').children).forEach((tr,j)=>{tr.classList.toggle('active',j===index);tr.setAttribute('aria-current',j===index?'step':'false')});if(index===steps.length-1&&timer)stop()}
$('prev').onclick=()=>{stop();show(index-1)};$('next').onclick=()=>{stop();show(index+1)};$('slider').oninput=e=>{stop();show(+e.target.value)};$('stepSelect').onchange=e=>{stop();show(+e.target.value)};$('play').onclick=()=>{if(timer){stop();return}if(index===steps.length-1)show(0);$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>show(index+1),1800)};
$('finalSummary').textContent=report.final.summary+' '+report.final.recommendation.reason;
for(const c of ['left','right']){const p=document.createElement('p');p.className='muted';p.textContent=`${c==='left'?'左目':'右目'}未覆盖中心区域：${report.coverage[c].missing_zones.map(([r,c])=>regions[r][c]).join('、')||'无'}（输入帧中心统计）`;$('finalSummary').append(p)}
$('board').textContent=`ChArUco ${report.board.cols} × ${report.board.rows} 格 · 方格 ${report.board.square_length*1000} mm · 标记 ${report.board.marker_length*1000} mm`;
$('limits').textContent=report.limits.join('；');
show(0);
</script></html>
